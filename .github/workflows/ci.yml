name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The suite already asserts that every scenario is faster; this asserts it
      # at the full dataset size, where a scenario that has quietly stopped
      # paying off is most visible. Timings on a shared runner are noisy, so the
      # threshold is far below the smallest published ratio.
      - run: npm run bench -- --check --min-speedup 2
